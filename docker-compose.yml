services:
  postgres:
    image: postgres:16-alpine
    container_name: wedlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wedlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wedlink_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-wedlink}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - ./docker/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wedlink} -d ${POSTGRES_DB:-wedlink}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wedlink-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-56379}:6379"
    volumes:
      - ./docker/data/redis:/data

  minio:
    image: minio/minio:latest
    container_name: wedlink-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-wedlink_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-wedlink_minio_dev_secret}
    ports:
      - "${S3_PORT:-59000}:9000"
      - "${MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - ./docker/data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
